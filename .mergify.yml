# CI validates, a reviewer signs off, Mergify merges.
#
# Two positive gates, both required: the automated review verdict check AND a
# label that only a maintainer applies after reading the change. This repo is
# public, so it takes that two-gate rule rather than merging on a clean verdict
# alone. The brake labels below stop a merge while any one of them is present.
#
# The checks listed are the ones main's branch ruleset requires: the test jobs
# of .github/workflows/test.yml (one per Node version in its matrix), CodeQL,
# and the public-text status. Change the ruleset, test.yml's matrix and this
# file together: a required check that never reports blocks every merge.
#
# Shape: merge_protections_settings plus queue_rules, as in SharpAPI-MCP. The
# older pull_request_rules + `queue` action validates cleanly but queues nothing.
#
# Nothing here releases or publishes: npm releases stay manual (publish.yml).
#
# Public-repository precautions:
# - Only branches of this repository are merged here. A pull request from a
#   fork is never queued, so the queue never pushes code from outside this
#   repository to one of its branches, where push-triggered workflows run with
#   this repository's context. A fork's pull request is merged by hand.
# - The approval is a label. Only people with triage access or more can add
#   labels, so a contributor from outside cannot approve their own change.
# - Mergify commands posted in comments stay limited to people with write
#   access (Mergify's default for every command) or this repository's bot.

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - head-repo-full-name = Sharp-API/SharpAPI-TS
    # The review verdict, bound to the app that publishes it: a check is
    # matched by name, so any installed app could post one with this name.
    - check-success = @sharp-resolver/sa-verdict
    - check-success = test (20)
    - check-success = test (22)
    - check-success = test (24)
    # CodeQL reports neutral, not success, on a pull request that changes no
    # code it analyzes, and main's branch rule already counts neutral as
    # passing. A failing CodeQL run still blocks.
    - check-success-or-neutral = CodeQL
    - check-success = public-text
    - label = sa-approved
    - label != do-not-merge
    - label != sa-needs-attention
    - label != sa-signoff:hold
    - label != sa-gate:hold

queue_rules:
  - name: default
    queue_conditions:
      - "#commits-behind < 50"
      - head-repo-full-name = Sharp-API/SharpAPI-TS
      - check-success = @sharp-resolver/sa-verdict
      - check-success = test (20)
      - check-success = test (22)
      - check-success = test (24)
      - check-success-or-neutral = CodeQL
      - check-success = public-text
      - label = sa-approved
      - label != do-not-merge
      - label != sa-needs-attention
      - label != sa-signoff:hold
      - label != sa-gate:hold
    # Only test.yml re-runs on the queue's own branch (it listens on
    # mergify/merge-queue/**); the review verdict, CodeQL and public-text are
    # not posted there, so they are queue conditions and never merge conditions.
    merge_conditions:
      - check-success = test (20)
      - check-success = test (22)
      - check-success = test (24)
    merge_method: squash
    batch_size: 1
    checks_timeout: 30min

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = sharp-resolver[bot]
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = sharp-resolver[bot]
