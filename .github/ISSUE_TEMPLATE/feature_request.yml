name: Feature request
description: Suggest something the SDK should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The method, type or option you would like to see, with a short example if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Any workaround you use now.
