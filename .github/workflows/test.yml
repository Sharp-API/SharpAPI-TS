name: Tests

on:
  push:
    branches: [main, "mergify/merge-queue/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The base tsconfig has include:["src"] and excludes tests/, and vitest runs
      # through esbuild which strips types without checking them — so the suite was
      # unchecked either way. This caught a real gap on its first run: OddsParams
      # had no `sport` field even though the API honours it.
      - run: npx tsc --noEmit -p tsconfig.test.json
      # This workflow is named Tests and did not run any: vitest was a devDependency,
      # `npm test` was defined in package.json, and `tests/` was gitignored so nothing
      # could ever be committed for it to execute.
      - run: npm test
      - run: npm run build
