name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The base tsconfig excludes tests, and Vitest uses esbuild without type
      # checking. Check test types separately to catch gaps such as the previously
      # missing OddsParams.sport field supported by the API.
      - run: npx tsc --noEmit -p tsconfig.test.json
      # Execute the committed regression tests on every supported Node version.
      - run: npm test
      - run: npm run build
      - run: npm run test:demo
