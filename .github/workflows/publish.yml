name: Publish to npm

on:
  release:
    types: [published]
  # workflow_dispatch lets operators dry-run the test matrix + gate
  # wiring without cutting a real release. The npm publish step is
  # guarded against non-release triggers below.
  workflow_dispatch:

jobs:
  # Mirror test.yml's Node matrix on the tagged commit: lint + typecheck
  # before publish. npm versions are immutable, so any gate we can apply
  # pre-upload is cheaper than publishing a broken release.
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npx tsup

      # OIDC trusted publishing needs npm CLI 11.5.1+; Node 20's bundled
      # npm (10.8.2) predates that, so upgrade before the publish step.
      # Pinned to the 11.x line, not @latest: npm 12 requires Node >=22,
      # which this job doesn't run (confirmed via EBADENGINE 2026-08-18).
      - run: npm install -g npm@11

      - name: Publish to npm
        # Only publish on an actual release event. workflow_dispatch
        # runs through test+build as a dry run but must not upload.
        #
        # Auth: OIDC trusted publisher (registered at
        # https://www.npmjs.com/package/@sharp-api/client/access). The
        # v0.4.2 release (2026-08-18) confirmed the provenance/OIDC half
        # was already working — the failure was a NODE_AUTH_TOKEN
        # automation token colliding with the package's access mode once
        # that mode was tightened to disallow bypass-2FA tokens. Dropped
        # the token entirely; npm CLI negotiates OIDC on its own now.
        # --provenance still emits the SLSA attestation on top.
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
