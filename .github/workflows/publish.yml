name: Publish to npm

on:
  release:
    types: [published]
  # workflow_dispatch lets operators dry-run the test matrix + gate
  # wiring without cutting a real release. The npm publish step is
  # guarded against non-release triggers below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Mirror test.yml's Node matrix on the tagged commit: lint + typecheck
  # before publish. npm versions are immutable, so any gate we can apply
  # pre-upload is cheaper than publishing a broken release.
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: gate
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npx tsup

      # Trusted publishing requires Node >=22.14 and npm >=11.5.1.
      - run: npm install -g npm@11

      - name: Publish to npm
        # Only publish on an actual release event. workflow_dispatch
        # runs the validation gate only; the protected job is skipped.
        #
        # OIDC trusted publishing is configured for @sharp-api/client.
        # npm negotiates OIDC without NODE_AUTH_TOKEN; automation tokens can
        # conflict with package access settings that disallow bypassing 2FA.
        # --provenance adds the SLSA attestation.
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
